<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>אישור הגעה - פלוגה מסייעת</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:linear-gradient(180deg,#5d2d91,#7e57c2);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:130px;
}

h1{
    text-align:center;
    color:#5d2d91;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:18px;
    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border:2px solid #e4d8f7;
    border-radius:12px;
    font-size:16px;
}

textarea{
    min-height:100px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:10px;
}

.option{
    border:2px solid #ddd;
    border-radius:14px;
    padding:18px;
    text-align:center;
}

.option:hover{
    border-color:#7e57c2;
}

button{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#5d2d91;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#45206e;
}

.success{
    display:none;
    margin-top:20px;
    background:#ede7f6;
    color:#45206e;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#888;
    margin-top:20px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
<img src="Logo.png" alt="סמל הפלוגה">
</div>

<h1>אירוע הוקרה & בנות זוג</h1>

<div class="subtitle">
פלוגה מסייעת • סיירת גבעתי
</div>

<label>שם מלא *</label>
<input type="text" id="name">

<label>צוות *</label>
<select id="team">
<option value="">בחר צוות</option>
<option>צוות דגן</option>
<option>צוות מרציאנו</option>
<option>צוות לבבי</option>
<option>צוות מירון</option>
<option>חפ"ק / מפל"ג</option>
</select>

<label>אישור הגעה *</label>

<div class="options">

<label class="option">
<input type="radio" name="attendance" value="מגיע לבד">
<br><br>
מגיע לבד
</label>

<label class="option">
<input type="radio" name="attendance" value="מגיע +1">
<br><br>
מגיע +1
</label>

<label class="option">
<input type="radio" name="attendance" value="אולי">
<br><br>
אולי
</label>

<label class="option">
<input type="radio" name="attendance" value="לא אגיע">
<br><br>
לא אגיע
</label>

</div>

<label>הערות לגבי האוכל</label>
<textarea id="food"></textarea>

<label>הערות כלליות</label>
<textarea id="notes"></textarea>

<button onclick="submitForm()">
שלח אישור הגעה
</button>

<div class="success" id="success">
תודה! אישור ההגעה נקלט בהצלחה.
</div>

<div class="footer">
הנתונים גלויים למנהל האירוע בלבד
</div>

</div>

</div>

<script>

function submitForm(){

const name=document.getElementById('name').value;
const team=document.getElementById('team').value;

if(!name){
alert('יש להזין שם מלא');
return;
}

if(!team){
alert('יש לבחור צוות');
return;
}

document.getElementById('success').style.display='block';

}

</script>

</body>
</html>
