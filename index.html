<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>אישור הגעה - פלוגה מסייעת</title>

<style>

body{
    margin:0;
    padding:0;
    background:#f4f0fa;
    font-family:Arial,sans-serif;
    direction:rtl;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.invitation{
    width:100%;
    display:block;
}

.content{
    padding:25px;
}

h1{
    color:#5d2d91;
    text-align:right;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:5px;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
    text-align:right;
}

textarea{
    min-height:90px;
}

.radio-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:10px;
}

.radio-card{
    border:2px solid #ddd;
    border-radius:10px;
    padding:15px;
    cursor:pointer;
    text-align:center;
}

.radio-card:hover{
    border-color:#7d3cb5;
}

.radio-card input{
    width:auto;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#6a1b9a;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#52167a;
}

.success{
    display:none;
    margin-top:20px;
    background:#e7d8f7;
    color:#4a148c;
    padding:15px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-top:25px;
}

</style>

</head>

<body>

<div class="container">

<img src="invitation.jpg" class="invitation">

<div class="content">

<h1>אישור הגעה לאירוע הוקרה & בנות זוג</h1>

<label>שם מלא *</label>
<input type="text" id="name">

<label>צוות *</label>
<select id="team">
<option value="">בחר צוות</option>
<option>צוות דגן</option>
<option>צוות מרציאנו</option>
<option>צוות לבבי</option>
<option>צוות מירון</option>
<option>חפ"ק / מפל"ג</option>
</select>

<label>אישור הגעה *</label>

<div class="radio-group">

<label class="radio-card">
<input type="radio" name="attendance" value="מגיע לבד">
<br><br>
מגיע לבד
</label>

<label class="radio-card">
<input type="radio" name="attendance" value="מגיע +1">
<br><br>
מגיע +1
</label>

<label class="radio-card">
<input type="radio" name="attendance" value="אולי">
<br><br>
אולי
</label>

<label class="radio-card">
<input type="radio" name="attendance" value="לא אגיע">
<br><br>
לא אגיע
</label>

</div>

<label>הערות לגבי האוכל</label>
<textarea id="food"></textarea>

<label>הערות כלליות</label>
<textarea id="notes"></textarea>

<button onclick="submitForm()">
שלח אישור הגעה
</button>

<div id="success" class="success">
תודה! אישור ההגעה נקלט בהצלחה.
</div>

<div class="footer">
הנתונים גלויים למנהל האירוע בלבד
</div>

</div>

</div>

<script>

function submitForm(){

const name=document.getElementById('name').value;
const team=document.getElementById('team').value;

if(!name){
    alert('יש להזין שם מלא');
    return;
}

if(!team){
    alert('יש לבחור צוות');
    return;
}

document.getElementById('success').style.display='block';

}

</script>

</body>

</html>
