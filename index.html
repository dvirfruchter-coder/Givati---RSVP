<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אירוע הוקרה & בנות זוג - סיירת גבעתי</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #521580;
            --primary-light: #7b2cbf;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }

        /* רקע דינמי שמשנה צבעים */
        body {
            background: linear-gradient(-45deg, #240046, #3c096c, #5a189a, #7b2cbf);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: var(--glass);
            width: 100%;
            max-width: 550px;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            transition: all 0.5s ease;
        }

        .logo {
            max-width: 110px;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.1));
        }

        h1 {
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            text-align: right;
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(123, 44, 191, 0.1);
        }

        /* עיצוב כרטיסיות אישור הגעה */
        .rsvp-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .rsvp-option {
            position: relative;
            cursor: pointer;
        }

        .rsvp-option input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .rsvp-card {
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            transition: all 0.3s ease;
            font-weight: 700;
            color: #555;
        }

        .rsvp-card i {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .rsvp-option input:checked + .rsvp-card {
            border-color: var(--primary-light);
            background: rgba(123, 44, 191, 0.05);
            color: var(--primary);
            transform: translateY(-2px);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(82, 21, 128, 0.3);
        }

        button:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        /* עמוד תודה */
        #thankYouMessage {
            display: none;
            padding: 40px 0;
        }

        .success-icon {
            font-size: 60px;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        .thank-you-title {
            font-size: 24px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    
    <div id="formSection">
        <img src="images/logo.png" alt="לוגו פלוגה ד'" class="logo">
        <h1>אירוע הוקרה & בנות זוג</h1>
        <div class="subtitle">פלוגה מסייעת • סיירת גבעתי</div>

        <form action="https://docs.google.com/forms/d/e/1FAIpQLSdpwYgM82G4N_87k2zI2Wcl_jL9i_bVId3b26P-vXj2-r225w/formResponse" 
              method="POST" 
              target="hidden_iframe" 
              onsubmit="handleSubmit()">
            
            <div class="form-group">
                <label>שם מלא *</label>
                <input type="text" name="entry.1594954005" required placeholder="הקש שם מלא">
            </div>

            <div class="form-group">
                <label>צוות *</label>
                <select name="entry.2069695666" required>
                    <option value="" disabled selected>בחר צוות</option>
                    <option value="צוות דגן">צוות דגן</option>
                    <option value="צוות מרציאנו">צוות מרציאנו</option>
                    <option value="צוות לבבי">צוות לבבי</option>
                    <option value="צוות מירון">צוות מירון</option>
                    <option value="חפ&quot;ק / מפל&quot;ג">חפ"ק / מפל"ג</option>
                </select>
            </div>

            <div class="form-group">
                <label>אישור הגעה *</label>
                <div class="rsvp-grid">
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1444370216" value="מגיע לבד" required>
                        <div class="rsvp-card"><i class="fa-solid fa-user"></i><span>מגיע לבד</span></div>
                    </label>
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1444370216" value="מגיע +1">
                        <div class="rsvp-card"><i class="fa-solid fa-heart"></i><span>מגיע +1</span></div>
                    </label>
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1444370216" value="אולי">
                        <div class="rsvp-card"><i class="fa-solid fa-question"></i><span>אולי</span></div>
                    </label>
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1444370216" value="לא אגיע">
                        <div class="rsvp-card"><i class="fa-solid fa-xmark"></i><span>לא אגיע</span></div>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>הערות אוכל (אלרגיות / צמחוני)</label>
                <textarea name="entry.246473180" placeholder="משהו שחשוב שנדע?"></textarea>
            </div>

            <div class="form-group">
                <label>הערות כלליות</label>
                <textarea name="entry.454215707" placeholder="הערות נוספות..."></textarea>
            </div>

            <button type="submit">שלח אישור הגעה</button>
        </form>
    </div>

    <div id="thankYouMessage">
        <i class="fa-solid fa-circle-check success-icon"></i>
        <div class="thank-you-title">ההרשמה בוצעה בהצלחה!</div>
        <p>תודה שעדכנת אותנו, ניפגש בקרוב.</p>
        <p style="margin-top: 20px; font-weight: bold; color: var(--primary);">יחד ננצח! 🫡</p>
        <img src="images/logo.png" alt="לוגו" style="width: 80px; margin-top: 30px; opacity: 0.5;">
    </div>

</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    function handleSubmit() {
        // מחליף את הטופס בהודעת תודה
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('thankYouMessage').style.display = 'block';
    }
</script>

</body>
</html>
