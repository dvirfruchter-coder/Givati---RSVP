<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אירוע הוקרה & בנות זוג - סיירת גבעתי</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-deep: #240046;
            --purple-main: #3c096c;
            --purple-light: #5a189a;
            --purple-bright: #7b2cbf;
            --purple-accent: #9d4edd;
            --gold: #ffb703;
            --gold-hover: #fb8500;
            --text-dark: #212529;
            --glass-bg: rgba(255, 255, 255, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, var(--purple-deep), var(--purple-main), var(--purple-light), var(--purple-bright));
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: var(--glass-bg);
            width: 100%;
            max-width: 580px;
            border-radius: 28px;
            padding: 40px 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo {
            width: 140px;
            height: auto;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.15));
        }

        h1 {
            color: var(--purple-main);
            font-size: 32px;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--purple-bright);
            font-size: 18px;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .form-group {
            text-align: right;
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: var(--purple-deep);
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background: #f8fafc;
            color: var(--text-dark);
            font-weight: 600;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--purple-bright);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(123, 44, 191, 0.15);
        }

        .rsvp-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .rsvp-option {
            position: relative;
            cursor: pointer;
        }

        .rsvp-option input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .rsvp-card {
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #fff;
            transition: all 0.3s ease;
            font-weight: 800;
            font-size: 16px;
        }

        .rsvp-card .icon {
            font-size: 32px;
        }

        /* צבעי סימון כרטיסיות */
        .rsvp-option input[value="מגיע לבד"]:checked + .rsvp-card {
            border-color: #4cc9f0;
            background: rgba(76, 201, 240, 0.08);
            color: #03045e;
        }

        .rsvp-option input[value="מגיע +1"]:checked + .rsvp-card {
            border-color: #f72585;
            background: rgba(247, 37, 133, 0.08);
            color: #7209b7;
        }

        .rsvp-option input[value="אולי"]:checked + .rsvp-card {
            border-color: #ffb703;
            background: rgba(255, 183, 3, 0.08);
            color: #ffb703;
        }

        .rsvp-option input[value="לא אגיע"]:checked + .rsvp-card {
            border-color: #e63946;
            background: rgba(230, 57, 70, 0.08);
            color: #e63946;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--gold), var(--gold-hover));
            color: var(--purple-deep);
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 6px 20px rgba(251, 133, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="formSection">
        <div class="logo-container">
            <img src="Logo.png" alt="לוגו פלוגה ד'" class="logo">
        </div>
        <h1>אירוע הוקרה & בנות זוג</h1>
        <div class="subtitle">פלוגה מסייעת • סיירת גבעתי</div>

        <form action="https://docs.google.com/forms/d/e/1FAIpQLScqO9sn9VthBrv-u-rhbSt36ZNYsvZ6GGV7Qty0KgcXmf4izA/formResponse" method="POST">
            
            <div class="form-group">
                <label>שם מלא *</label>
                <input type="text" name="entry.1465225407" required placeholder="הקש שם מלא">
            </div>

            <div class="form-group">
                <label>צוות *</label>
                <select name="entry.1764669865" required>
                    <option value="" disabled selected>בחר צוות</option>
                    <option value="צוות דגן">צוות דגן</option>
                    <option value="צוות מרציאנו">צוות מרציאנו</option>
                    <option value="צוות לבבי">צו館 צוות לבבי</option>
                    <option value="צוות מירון">צוות מירון</option>
                    <option value="חפ&quot;ק / מפל&quot;ג">חפ"ק / מפל"ג</option>
                </select>
            </div>

            <div class="form-group">
                <label>אישור הגעה *</label>
                <div class="rsvp-grid">
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1011603511" value="מגיע לבד" required>
                        <div class="rsvp-card"><span class="icon">🫡</span><span>מגיע לבד</span></div>
                    </label>
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1011603511" value="מגיע +1">
                        <div class="rsvp-card"><span class="icon">❤️</span><span>מגיע +1</span></div>
                    </label>
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1011603511" value="אולי">
                        <div class="rsvp-card"><span class="icon">❓</span><span>אולי</span></div>
                    </label>
                    <label class="rsvp-option">
                        <input type="radio" name="entry.1011603511" value="לא אגיע">
                        <div class="rsvp-card"><span class="icon">❌</span><span>לא אגיע</span></div>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>הערות אוכל (אלרגיות / צמחוני)</label>
                <textarea name="entry.2066804595" placeholder="משהו שחשוב שנדע לקראת האירוע?"></textarea>
            </div>

            <div class="form-group">
                <label>הערות כלליות</label>
                <textarea name="entry.1215707738" placeholder="הערות או בקשות נוספות..."></textarea>
            </div>

            <button type="submit">שלח אישור הגעה</button>
        </form>
    </div>

</div>

</body>
</html>
