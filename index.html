<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>אירוע הוקרה & בנות זוג</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4A148C,#7B1FA2,#9575CD);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:750px;
    margin:auto;
}

.card{
    background:white;
    border-radius:28px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:200px;
    max-width:100%;
}

h1{
    text-align:center;
    color:#4A148C;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:18px;
    font-weight:bold;
    color:#333;
}

input[type="text"],
select,
textarea{
    width:100%;
    padding:14px;
    border:2px solid #E1BEE7;
    border-radius:14px;
    font-size:16px;
}

textarea{
    min-height:100px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:10px;
}

.option{
    border:2px solid #DDD;
    border-radius:16px;
    padding:20px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#7B1FA2;
    background:#F7F0FF;
}

.option input{
    margin-bottom:10px;
}

button{
    width:100%;
    padding:16px;
    margin-top:25px;
    border:none;
    border-radius:16px;
    background:#6A1B9A;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#4A148C;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:14px;
}

/* מסך תודה */
#thankYou{
    display:none;
}

.thankyou-card{
    background:white;
    border-radius:28px;
    padding:50px 30px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

.thankyou-card img{
    width:220px;
    margin-bottom:20px;
}

.thankyou-card h2{
    color:#4A148C;
    margin-bottom:15px;
    font-size:32px;
}

.thankyou-card p{
    color:#555;
    line-height:1.8;
    font-size:18px;
}

.back-btn{
    margin-top:25px;
    background:#6A1B9A;
}
</style>
</head>

<body>

<div class="container">

<div id="formSection">

<div class="card">

<div class="logo">
<img src="Logo.png" alt="לוגו הפלוגה">
</div>

<h1>אירוע הוקרה & בנות זוג</h1>

<div class="subtitle">
פלוגה מסייעת • סיירת גבעתי
</div>

<form id="gievatiForm" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSevRWe1b57G482zC83D6b7Y2aZ6vG9e8_N4FaSzyqfWbFQ/formResponse" method="POST">

<label>שם מלא *</label>
<input type="text" id="name" name="entry.2065584592" required>

<label>צוות *</label>
<select id="team" name="entry.1293847561" required>
<option value="">בחר צוות</option>
<option value="צוות דגן">צוות דגן</option>
<option value="צוות מרציאנו">צוות מרציאנו</option>
<option value="צוות לבבי">צוות לבבי</option>
<option value="צוות מירון">צוות מירון</option>
<option value="חפ&quot;ק / מפל&quot;ג">חפ"ק / מפל"ג</option>
</select>

<label>אישור הגעה *</label>

<div class="options">

<label class="option">
<input type="radio" name="entry.1847562930" value="מגיע לבד" required>
<div>מגיע לבד</div>
</label>

<label class="option">
<input type="radio" name="entry.1847562930" value="מגיע +1">
<div>מגיע +1</div>
</label>

<label class="option">
<input type="radio" name="entry.1847562930" value="אולי">
<div>אולי</div>
</label>

<label class="option">
<input type="radio" name="entry.1847562930" value="לא אגיע">
<div>לא אגיע</div>
</label>

</div>

<label>הערות לגבי האוכל</label>
<textarea id="food" name="entry.582910475"></textarea>

<label>הערות כלליות</label>
<textarea id="notes" name="entry.938475621"></textarea>

<button type="submit">
שלח אישור הגעה
</button>

</form>

<div class="footer">
המידע גלוי למנהל האירוע בלבד
</div>

</div>

</div>

<div id="thankYou">

<div class="thankyou-card">

<img src="Logo.png" alt="לוגו הפלוגה">

<h2>תודה!</h2>

<p>
אישור ההגעה התקבל בהצלחה.
<br><br>
נתראה באירוע ההוקרה של
<br>
פלוגה מסייעת – סיירת גבעתי
</p>

<button class="back-btn" onclick="location.reload()">
חזרה לטופס
</button>

</div>

</div>

</div>

<script>
document.getElementById('gievatiForm').addEventListener('submit', function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value;
    let team = document.getElementById("team").value;

    if(name.trim() === ""){
        alert("יש להזין שם מלא");
        return;
    }

    if(team === ""){
        alert("יש לבחור צוות");
        return;
    }

    const formData = new FormData(this);

    fetch(this.action, {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
    })
    .then(() => {
        document.getElementById("formSection").style.display = "none";
        document.getElementById("thankYou").style.display = "block";
    })
    .catch(error => {
        alert('אופס! היתה שגיאה בתקשורת. אנא נסה שוב.');
        console.error('Error:', error);
    });
});
</script>

</body>
</html>
