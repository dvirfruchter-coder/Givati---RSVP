<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אירוע הוקרה & בנות זוג - סיירת גבעתי</title>
    <style>
        :root {
            --primary: #521580;
            --primary-light: #7b2cbf;
            --bg-gradient: linear-gradient(135deg, #240046 0%, #3c096c 50%, #5a189a 100%);
            --text-main: #333333;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            max-width: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.1));
        }

        h1 {
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .subtitle::after {
            content: '';
            display: block;
            width: 50%;
            height: 3px;
            background: var(--primary-light);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(123, 44, 191, 0.15);
        }

        /* עיצוב כפתורי הרדיו ככרטיסיות חיות */
        .rsvp-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 5px;
        }

        .rsvp-option {
            position: relative;
        }

        .rsvp-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .rsvp-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #fff;
            transition: all 0.25s ease;
            font-weight: 600;
            color: #555;
        }

        .rsvp-card .icon {
            font-size: 22px;
        }

        /* מראה בזמן בחירה */
        .rsvp-option input[type="radio"]:checked + .rsvp-card {
            border-color: var(--primary-light);
            background: rgba(123, 44, 191, 0.08);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(123, 44, 191, 0.15);
        }

        .rsvp-option:hover .rsvp-card {
            border-color: #b39ddb;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(82, 21, 128, 0.3);
        }

        button:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://dvirfruchter-coder.github.io/Givati---RSVP/images/logo.png" alt="לוגו פלוגה ד'" class="logo" onerror="this.style.display='none'">
    
    <h1>אירוע הוקרה & בנות זוג</h1>
    <div class="subtitle">פלוגה מסייעת • סיירת גבעתי</div>

    <form id="rsvpForm">
        <div class="form-group">
            <label for="fullName">שם מלא *</label>
            <input type="text" id="fullName" required placeholder="הקש את שמך">
        </div>

        <div class="form-group">
            <label for="team">צוות *</label>
            <select id="team" required>
                <option value="" disabled selected>בחר צוות</option>
                <option value="dagan">צוות דגן</option>
                <option value="marciano">צוות מרציאנו</option>
                <option value="levavi">צוות לבבי</option>
                <option value="miron">צוות מירון</option>
                <option value="command">חפ"ק / מפל"ג</option>
            </select>
        </div>

        <div class="form-group">
            <label>אישור הגעה *</label>
            <div class="rsvp-grid">
                <div class="rsvp-option">
                    <input type="radio" name="attendance" value="alone" required>
                    <div class="rsvp-card">
                        <span class="icon">🫡</span>
                        <span>מגיע לבד</span>
                    </div>
                </div>
                <div class="rsvp-option">
                    <input type="radio" name="attendance" value="plus1">
                    <div class="rsvp-card">
                        <span class="icon">❤️</span>
                        <span>מגיע +1</span>
                    </div>
                </div>
                <div class="rsvp-option">
                    <input type="radio" name="attendance" value="maybe">
                    <div class="rsvp-card">
                        <span class="icon">❓</span>
                        <span>אולי</span>
                    </div>
                </div>
                <div class="rsvp-option">
                    <input type="radio" name="attendance" value="no">
                    <div class="rsvp-card">
                        <span class="icon">❌</span>
                        <span>לא אגיע</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="foodNotes">הערות לגבי האוכל (אלרגיות / צמחוני / טבעוני)</label>
            <textarea id="foodNotes" placeholder="אם יש משהו שחשוב שנדע..."></textarea>
        </div>

        <div class="form-group">
            <label for="generalNotes">הערות כלליות</label>
            <textarea id="generalNotes" placeholder="משהו נוסף?"></textarea>
        </div>

        <button type="submit">שלח אישור הגעה</button>
    </form>

    <div class="footer-note">המידע גלוי למנהל האירוע בלבד</div>
</div>

</body>
</html>
